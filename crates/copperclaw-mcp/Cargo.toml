[package]
name = "copperclaw-mcp"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
copperclaw-types = { workspace = true }
copperclaw-db = { workspace = true }
copperclaw-channels-core = { workspace = true }
copperclaw-container-rt = { workspace = true }
copperclaw-browser = { workspace = true }
copperclaw-skills = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
rmcp = { workspace = true, features = ["client", "server", "transport-child-process", "transport-sse-client", "reqwest"] }
reqwest = { workspace = true }
htmd = "0.2"
ignore = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
similar = { workspace = true }
# git2 is libgit2-sys under the hood. We pin a recent stable line and use
# the vendored libgit2 build so the workspace doesn't grow a runtime
# dependency on the host's system libgit2 (which is missing on many
# minimal CI images). Vendored-libgit2 also pulls in `cc`/`cmake` at
# build time only; the resulting binary statically links libgit2.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
copperclaw-metrics.workspace = true
# M20 Q6: content-hash the project diff at review-submission time so a later
# `todo_update(completed)` can tell "nothing changed since review" from "it
# did" without a git ref (uncommitted work has no ref to pin to).
sha2 = { workspace = true }

[dev-dependencies]
# Test-only: `test-util` unlocks tokio's paused-clock controls
# (`start_paused`, `time::advance`) so the connection-cache idle-reap tests
# run with zero real waits (M21 F4).
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
tempfile = "3"

# M21 F4: the connection-cache integration proof drives a real stdio MCP
# server (this test binary re-executed in stub mode), so it needs raw
# ownership of stdout — libtest's harness would interleave its own output
# into the MCP stream.
[[test]]
name = "external_cache_stub"
harness = false

[lints]
workspace = true
